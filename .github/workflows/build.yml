name: Build

on:
    push:
        branches: [ develop ]
    pull_request:
        branches: [ develop ]

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7

            -   name: Set up JDK 17
                uses: actions/setup-java@v6
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Cache local Maven repository
                uses: actions/cache@v6
                with:
                    path: ~/.m2/repository
                    key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-maven-

            -   name: Maven Verify
                run: mvn verify
